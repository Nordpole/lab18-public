version: 1
domain: percona_operator
created_by: your_team_name
document_outline: Q&A dataset for Percona Operator on OpenShift and PostgreSQL backup/restore

seed_examples:
  - context: |
      Latest Percona Operator at the moment of training
    questions_and_answers:
      - question: What is the latest version of Percona Operator?
        answer: Sure—at the time of our data (April 2025), it’s 2.6.0. Would you like steps  to install it?
      - question: Can I use different versions , controlled by the same Operator
        answer: Yes, percona operator supports wide range of versions , starting from 10 to 16
      - question: Can I use different versions for DB and supporting tools, like BackUp
        answer: Yes, its possible, but better to harmonize the versions in one setup

  - context: |
      In  accordance  with  the  agreed  practice,  each  product  will  have  an  individual  namespace  where Percona Operator and PG Cluster will be created,
      as recommended by Percona. Naturally, at least ten  installations  (5  operator  +  5  cluster)  should  not  be  performed  manually,  but  should
      be automated, as suggested by RH GitOps practice.
    questions_and_answers:
      - question: Can I install Percona Operator on OpenShift?
        answer:  Yes! You can install via the Operator Lifecycle Manager (OLM) or by applying the YAML manifest directly.
      - question: Can I use ArgoCD for installation Percona Operator on OpenShift?
        answer: Yes! Thats the best approach to have it automated under ArgoCD project with overlays

  - context: |
      The PostgreSQL Cluster (with default postgres DB) is not a separate entity, but the foundation of a large fleet of Red Hat products installed on OCP customer cluster(s). For every product in the PG cluster we must initiate DB , talored for teh product deployment.
    questions_and_answers:
      - question: Should I use a separate namespace for Percona Operator?
        answer: |
          Percona Operator and each DB cluster must be installed in their own namespaces to isolate resources and minimize blast radius.
      - question: Can Percona Operator install extensions for selected Database?
        answer: |
          Percona Operator has special section in CR yaml for internal and external extensions
      - question: Can Percona Operator provide the secret with all Database connection details?
        answer: |
          Percona Operator has special section in CR yaml for internal and external extensions    

  - context: |
      backups: trackLatestRestorableTime: true pgbackrest: image: percona/percona-
      postgresql-operator:2.6.0-ppg16.8-pgbackrest2.54.2 # Run a manual full backup
      on-demand (you can omit this if you only want # scheduled backups) manual:
      repoName: repo1 options: - --type=full # Define your repository and backup
      schedule repos: - name: repo1 schedules: # run a full backup every Saturday at
      midnight full: "0 0 * * 6" volume: volumeClaimSpec: accessModes: - ReadWriteOnce
      resources: requests: storage: 1Gi # The 'repoHost' stanza (below) controls where
      the backup-job Pods mount this volume. repoHost: affinity: podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution: - weight: 1 podAffinityTerm:
    questions_and_answers:
      - question: What tool is available for Percona PostgreSQL backup and restore?
        answer: pgBackRest provide backup and restore functionality for full or incremental backup and restore to the point in time
      - question: Can I have my backup protected using encryption ?
        answer: pgBackRest provide encryption for backup using encryption key, configured in corresponding CR
      - question: Can I have my backup stored on external S3 volume ?
        answer: pgBackRest can store it on external S3 storage, if location and credentials provided
      - question: What is the image used for the pgbackrest?
        answer: percona/percona-postgresql-operator:2.6.0-ppg16.8-pgbackrest2.54.2
      - question: What is the schedule for the full backups?
        answer: A full backup is scheduled to run every Saturday at midnight.
      - question: |-
          Based on the provided context, why is it recommended to use a separate volume
          for backups?
        answer: |-
          A separate volume for backups is recommended to ensure that the backup data is
          stored separately from the main data, providing an additional layer of data
          protection and ensuring that the backup process does not impact the performance
          of the main database.  


