version: "1.0"
domain: "percona PG Operator"
created_by: "InstructLab Team"
document_outline: "CER for percona Operator Deployment"
seed_examples:
  - context: |
      In  accordance  with  the  agreed  practice,  each  product  will  have  an  individual  namespace  where Percona Operator and PG Cluster will be created,
      as recommended by Percona. Naturally, at least ten  installations  (5  operator  +  5  cluster)  should  not  be  performed  manually,  but  should
      be automated, as suggested by RH GitOps practice.
    questions_and_answers:
      - question: Hi, can you tell me the latest Percona Operator version?
        answer: |
          Sure—at the time of our data (April 2025), it’s 2.6.0. Would you like steps  to install it?
      - question: Can I install Percona Operator on OpenShift?
        answer: |
          Yes! You can install via the Operator Lifecycle Manager (OLM) or by  applying the YAML manifest directly.
      - question: Should I isolate operator and DB clusters in separate namespaces?
        answer: |
          Yes, it’s best practice to use separate namespaces to limit blast radius  and simplify RBAC.
 

qnas:
  - id: "1"
    question: "What is the latest version of Percona operator"
    answer: "2.6.0"
    context: |
      Latest percona Operator at the moment of training

  - id: "2"
    question: "Can I install percona Operator on OpenShift?"
    answer: "Yes"
    context: |
      Percona Installation type

  - id: "3"
    question: "Should I use separate namespace for Percona Operator?"
    answer: |
      Percona Operator and DB Cluster must be installed on individual namespaces, connected to the individual products in order to minimise blast radius
    context: |
      Deployment namespace separation for Percona Operator

  - id: "4"
    question: "What tool is available for Percona PG DB backup and restore"
    answer: "pgBackRest"
    context: |
      pgBackRest provide backup and restore functionality for full or incremental backup and restore to the point in time
